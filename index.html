body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,8,16,.55),rgba(5,8,16,.8));z-index:-1}
.wrap{max-width:1180px;margin:auto;padding:16px}
.logo{background:#fff;border-radius:14px;padding:10px 14px;text-align:center;border:2px solid var(--gold)}
.logo img{max-width:100%;max-height:150px;display:block;margin:auto}
h1{font-size:clamp(22px,4vw,34px);text-align:center;margin:18px 0 4px;color:var(--gold2);letter-spacing:.03em}
.tag{text-align:center;color:var(--mute);font-size:14px;margin-bottom:16px;font-family:system-ui,sans-serif}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;font-family:system-ui,sans-serif}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.set label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input,select,button{font:inherit;color:var(--ink)}
input[type=number],input[type=date],select{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
select option{background:#0d1424}
button{cursor:pointer;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600}
button:hover{border-color:var(--gold)}
button.red{color:var(--loss)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:11px;font-size:15px}
nav button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.panel{display:none}.panel.on{display:block}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(6px);max-height:70vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;min-width:720px;font-family:system-ui,sans-serif}
th,td{padding:9px 8px;text-align:center;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
th{background:#0b1020;color:var(--gold2);position:sticky;top:0;z-index:2}
tr.success{background:rgba(60,207,122,.14)}tr.warning{background:rgba(242,201,76,.14)}tr.loss{background:rgba(255,107,118,.15)}
td{white-space:nowrap}td input{width:66px;text-align:center;padding:5px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:6px}
.tg{color:var(--gold2);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;font-family:system-ui,sans-serif}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--mute)}.kpi b{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums}
.pos{color:var(--win)}.neg{color:var(--loss)}
.chart{height:320px;margin-top:10px}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.sub{font-size:13px;color:var(--mute)}
</style>
</head>

  <h1>INTIZAMLI TRADING CHALLENGE</h1>
  <div class="tag">Intizam, sabır, nátiyje. Kúnlik sawdańızdı belgilep barıń.</div>

  <div class="card">
    <div class="set">
      <label>Baslanǵısh summa ($)<input type="number" id="initBal" min="1" step="1"></label>
      <label>Challenge dawamlılıǵı
        <select id="dur"><option value="30">1 ay (30 kún)</option><option value="90">3 ay (90 kún)</option><option value="180">6 ay (180 kún)</option><option value="custom">Óz kún sanım</option></select>
      </label>
      <label id="cdWrap" style="display:none">Kún sanı (1-365)<input type="number" id="cd" min="1" max="365" step="1"></label>
      <label>Kúnlik maqset (%)<input type="number" id="tgt" min="0" step="0.1"></label>
      <label>Qáwip (%)<input type="number" id="rsk" min="0" step="0.1"></label>
      <label>Baslanıw sánesi<input type="date" id="sd"></label>
      <button class="red" onclick="resetAll()">Tazalaw</button>
    </div>
  </div>

  <nav id="tabs"><button class="on" data-t="table">Keste</button><button data-t="stats">Statistika hám grafik</button></nav>

  <section class="panel on" id="p-table"><div class="tw"><table>
    <thead><tr><th>Kún</th><th>Sáne</th><th>Baslanǵısh ($)</th><th>Qáwip ($)</th><th>Maqset ($)</th><th>Payda / Ziyan (%)</th><th>Jabılıw ($)</th><th>Jaǵday</th></tr></thead>
    <tbody id="tb"></tbody></table></div></section>

  <section class="panel" id="p-stats">
    <div class="kpis" id="kpis"></div>
    <div class="card"><b>Kúnlik ósiw</b><div class="sub" id="note"></div><div class="chart"><canvas id="chart"></canvas></div></div>
    <div class="card"><b>Challenge barısı</b><div class="sub" id="prog"></div><div class="bar"><i id="pb" style="width:0"></i></div></div>
  </section>
</div>

<script>
const MAX=365, KEY='it_challenge_v1';
const LBL={pending:'Kútilmekte ⏳',success:'Orınlandı ✅',warning:'Az payda ⚠️',loss:'Ziyan ❌'};
let st={status:Array(MAX).fill('pending'),profit:Array(MAX).fill(0),initBal:100,days:30,tgt:5,rsk:2,sd:new Date().toISOString().slice(0,10)};
const $=id=>document.getElementById(id);
const bal=[],close=[];let chart;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.status&&s.status.length===MAX)st=Object.assign(st,s)}catch(e){}
const N=()=>st.days;
const money=v=>'$'+v.toFixed(2);
function dt(i){const d=new Date(st.sd+'T00:00:00');d.setDate(d.getDate()+i);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')}
function compute(){let b=st.initBal;for(let i=0;i<N();i++){bal[i]=b;let e=b*(1+st.profit[i]/100);if(e<0)e=0;close[i]=e;b=e}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function renderTable(){
  let h='';
  for(let i=0;i<N();i++){const s=st.status[i];
    h+=`<tr class="${s}"><td><b>${i+1}</b></td><td>${dt(i)}</td><td>${money(bal[i])}</td><td>${money(bal[i]*st.rsk/100)}</td><td class="tg">${money(bal[i]*st.tgt/100)}</td>
    <td><input type="number" step="0.1" value="${st.profit[i]}" onchange="setP(${i},this.value)">%</td><td><b>${money(close[i])}</b></td>
    <td><select onchange="setS(${i},this.value)">${Object.keys(LBL).map(k=>`<option value="${k}" ${s===k?'selected':''}>${LBL[k]}</option>`).join('')}</select></td></tr>`}
  $('tb').innerHTML=h;
}
function stats(){
  const done=[];for(let i=0;i<N();i++)if(st.status[i]!=='pending')done.push(i);
  const wins=done.filter(i=>st.profit[i]>0).length,loss=done.filter(i=>st.profit[i]<0).length;
  let best=0,run=0,cur=0;for(const i of done){if(st.profit[i]>0){run++;best=Math.max(best,run)}else run=0}
  for(let k=done.length-1;k>=0&&st.profit[done[k]]>0;k--)cur++;
  const last=done.length?done[done.length-1]:-1,now=last>=0?close[last]:st.initBal;
  let pk=st.initBal,dd=0;for(const i of done){pk=Math.max(pk,close[i]);dd=Math.max(dd,(pk-close[i])/pk*100)}
  const plan=[];let pb=st.initBal;for(let i=0;i<N();i++){pb*=1+st.tgt/100;plan.push(pb)}
  return{n:done.length,wins,loss,best,cur,last,now,dd,plan,g:(now/st.initBal-1)*100,rate:done.length?wins/done.length*100:0,avg:done.length?done.reduce((s,i)=>s+st.profit[i],0)/done.length:0};
}
function renderStats(){
  const s=stats();
  const k=[['Házirgi balans',money(s.now),''],['Ulıwma ósiw',(s.g>=0?'+':'')+s.g.toFixed(1)+'%',s.g>=0?'pos':'neg'],['Orınlanǵan kún',s.n+' / '+N(),''],['Jaqsı kúnler',s.rate.toFixed(0)+'%',''],['Paydalı / ziyanlı',s.wins+' / '+s.loss,''],['Házirgi izbe-izlik',s.cur+' kún',''],['Eń úlken izbe-izlik',s.best+' kún',''],['Orta kúnlik %',(s.avg>=0?'+':'')+s.avg.toFixed(2)+'%',s.avg>=0?'pos':'neg'],['Eń úlken túsiw',s.dd.toFixed(1)+'%',s.dd>0?'neg':'']];
  $('kpis').innerHTML=k.map(x=>`<div class="kpi"><span>${x[0]}</span><b class="${x[2]}">${x[1]}</b></div>`).join('');
  const pn=s.last>=0?s.plan[s.last]:st.initBal;
  $('note').textContent=`Maqset boyınsha ${N()}-kúnde: ${money(s.plan[N()-1])}.`+(s.last>=0?` ${s.last+1}-kúnge shekem reje ${money(pn)}, sizde ${money(s.now)}.`:'');
  $('prog').textContent=`${s.n} kún belgilengen, ${N()-s.n} kún qalǵan.`;
  $('pb').style.width=(s.n/N()*100)+'%';
  chart.data.labels=Array.from({length:N()},(_,i)=>i+1);
  chart.data.datasets[0].data=[...Array(N()).keys()].map(i=>st.status[i]==='pending'?null:close[i]);
  chart.data.datasets[1].data=s.plan;
  chart.update();
}
function refresh(){compute();save();renderTable();renderStats()}
function setP(i,v){const p=parseFloat(v)||0;st.profit[i]=p;if(st.status[i]==='pending'&&p!==0)st.status[i]=p>0?'success':'loss';refresh()}
function setS(i,v){
  st.status[i]=v;
  if(v==='success'&&st.profit[i]<=0)st.profit[i]=st.tgt;
  else if(v==='warning'&&st.profit[i]<=0)st.profit[i]=+(st.tgt/2).toFixed(1);
  else if(v==='loss'&&st.profit[i]>=0)st.profit[i]=-st.rsk;
  else if(v==='pending')st.profit[i]=0;
  refresh();
}
function resetAll(){if(!confirm('Barlıq kúnlik belgiler óshiriledi. Dawam etemiz be?'))return;st.status=Array(MAX).fill('pending');st.profit=Array(MAX).fill(0);refresh()}
function bind(){
  $('initBal').value=st.initBal;$('tgt').value=st.tgt;$('rsk').value=st.rsk;$('sd').value=st.sd;
  const preset=[30,90,180].includes(st.days)?String(st.days):'custom';
  $('dur').value=preset;$('cd').value=st.days;$('cdWrap').style.display=preset==='custom'?'flex':'none';
}
$('initBal').onchange=e=>{st.initBal=Math.max(1,parseFloat(e.target.value)||100);refresh()};
$('tgt').onchange=e=>{st.tgt=Math.max(0,parseFloat(e.target.value)||0);refresh()};
$('rsk').onchange=e=>{st.rsk=Math.max(0,parseFloat(e.target.value)||0);refresh()};
$('sd').onchange=e=>{if(e.target.value){st.sd=e.target.value;refresh()}};
$('dur').onchange=e=>{if(e.target.value==='custom'){$('cdWrap').style.display='flex'}else{st.days=+e.target.value;$('cd').value=st.days;$('cdWrap').style.display='none';refresh()}};
$('cd').onchange=e=>{st.days=Math.min(MAX,Math.max(1,parseInt(e.target.value)||30));e.target.value=st.days;refresh()};
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  if(t==='stats')chart.resize()};
